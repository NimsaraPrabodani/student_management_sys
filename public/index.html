<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- NAVIGATION -->
  <nav class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-black tracking-tight">🎓 SMS Portal</span>
      </div>
      <div id="authActions" class="space-x-3">
        <!-- Rendered by JS -->
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto p-4 sm:p-6">
    
    <!-- AUTHENTICATION VIEW -->
    <div id="authView" class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg border border-slate-200">
      <div class="flex border-b border-slate-200 mb-6">
        <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-semibold border-b-2 border-indigo-600 text-indigo-600">Login</button>
        <button id="registerTabBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 font-semibold text-slate-500 hover:text-indigo-600">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="admin@sms.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200">Log In</button>
        <p class="text-xs text-slate-400 text-center">Demo Admin: admin@sms.com / AdminPassword123</p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
          <input type="text" id="regName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="regEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="regPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Department</label>
          <input type="text" id="regDept" placeholder="e.g. Computer Science" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200">Register as Student</button>
      </form>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="hidden space-y-6">
      
      <!-- Metrics Bar (Admin Only) -->
      <div id="adminMetrics" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Enrolled Students</p>
          <h3 id="statStudents" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Active Courses</p>
          <h3 id="statCourses" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-sm font-medium text-slate-500">Attendance Logs</p>
          <h3 id="statAttendance" class="text-3xl font-bold text-slate-800 mt-1">0</h3>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex space-x-3 border-b border-slate-200">
        <button onclick="switchTab('coursesTab')" class="tab-btn px-4 py-2 font-medium border-b-2 border-indigo-600 text-indigo-600">Courses</button>
        <button onclick="switchTab('attendanceTab')" class="tab-btn px-4 py-2 font-medium text-slate-500 hover:text-indigo-600">Attendance</button>
        <button id="studentsTabBtn" onclick="switchTab('studentsTab')" class="tab-btn px-4 py-2 font-medium text-slate-500 hover:text-indigo-600">Students</button>
      </div>

      <!-- TAB 1: COURSES -->
      <section id="coursesTab" class="tab-content space-y-6">
        <div id="createCourseCard" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
          <h2 class="text-lg font-bold text-slate-800 mb-4">Add New Course</h2>
          <form onsubmit="handleCreateCourse(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" id="courseCode" placeholder="Code (e.g. CS102)" required class="border px-3 py-2 rounded-lg outline-none">
            <input type="text" id="courseTitle" placeholder="Course Title" required class="border px-3 py-2 rounded-lg outline-none">
            <input type="number" id="courseCredits" placeholder="Credits (1-5)" min="1" max="5" value="3" class="border px-3 py-2 rounded-lg outline-none">
            <button type="submit" class="bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">Add Course</button>
          </form>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-100 text-slate-700 uppercase font-medium">
              <tr>
                <th class="px-6 py-3">Code</th>
                <th class="px-6 py-3">Title</th>
                <th class="px-6 py-3">Credits</th>
                <th class="px-6 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="coursesTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <!-- TAB 2: ATTENDANCE -->
      <section id="attendanceTab" class="tab-content hidden space-y-6">
        <!-- Mark Attendance Form (Admin Only) -->
        <div id="markAttendanceCard" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
          <h2 class="text-lg font-bold text-slate-800 mb-4">Record Attendance</h2>
          <form onsubmit="handleRecordAttendance(event)" class="grid grid-cols-1 md:grid-cols-5 gap-3">
            <select id="attCourseSelect" required class="border px-3 py-2 rounded-lg outline-none"></select>
            <select id="attStudentSelect" required class="border px-3 py-2 rounded-lg outline-none"></select>
            <input type="date" id="attDate" required class="border px-3 py-2 rounded-lg outline-none">
            <select id="attStatus" class="border px-3 py-2 rounded-lg outline-none">
              <option value="Present">Present</option>
              <option value="Absent">Absent</option>
              <option value="Late">Late</option>
            </select>
            <button type="submit" class="bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700">Mark Attendance</button>
          </form>
        </div>

        <!-- Attendance Records Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-100 text-slate-700 uppercase font-medium">
              <tr>
                <th class="px-6 py-3">Date</th>
                <th class="px-6 py-3">Student</th>
                <th class="px-6 py-3">Course</th>
                <th class="px-6 py-3">Status</th>
              </tr>
            </thead>
            <tbody id="attendanceTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <!-- TAB 3: STUDENTS DIRECTORY -->
      <section id="studentsTab" class="tab-content hidden space-y-6">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <table class="w-full text-left text-sm text-slate-600">
            <thead class="bg-slate-100 text-slate-700 uppercase font-medium">
              <tr>
                <th class="px-6 py-3">Student Code</th>
                <th class="px-6 py-3">Name</th>
                <th class="px-6 py-3">Email</th>
                <th class="px-6 py-3">Department</th>
              </tr>
            </thead>
            <tbody id="studentsTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

    </div>
  </main>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('sms_user')) || null;
    let token = localStorage.getItem('sms_token') || null;

    // Boot
    window.onload = () => {
      document.getElementById('attDate').valueAsDate = new Date();
      updateAuthState();
    };

    function updateAuthState() {
      const authActions = document.getElementById('authActions');
      const authView = document.getElementById('authView');
      const dashboardView = document.getElementById('dashboardView');

      if (token && currentUser) {
        authView.classList.add('hidden');
        dashboardView.classList.remove('hidden');

        authActions.innerHTML = `
          <span class="text-sm font-medium mr-2">Hello, <b>${currentUser.name}</b> (${currentUser.role})</span>
          <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-lg text-sm transition">Logout</button>
        `;

        if (currentUser.role === 'admin') {
          document.getElementById('adminMetrics').classList.remove('hidden');
          document.getElementById('createCourseCard').classList.remove('hidden');
          document.getElementById('markAttendanceCard').classList.remove('hidden');
          document.getElementById('studentsTabBtn').classList.remove('hidden');
          loadAdminStats();
          loadStudents();
        } else {
          document.getElementById('adminMetrics').classList.add('hidden');
          document.getElementById('createCourseCard').classList.add('hidden');
          document.getElementById('markAttendanceCard').classList.add('hidden');
          document.getElementById('studentsTabBtn').classList.add('hidden');
        }

        loadCourses();
        loadAttendance();
      } else {
        authView.classList.remove('hidden');
        dashboardView.classList.add('hidden');
        authActions.innerHTML = '';
      }
    }

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginTabBtn').className = 'flex-1 py-2 font-semibold border-b-2 border-indigo-600 text-indigo-600';
        document.getElementById('registerTabBtn').className = 'flex-1 py-2 font-semibold text-slate-500 hover:text-indigo-600';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('registerTabBtn').className = 'flex-1 py-2 font-semibold border-b-2 border-indigo-600 text-indigo-600';
        document.getElementById('loginTabBtn').className = 'flex-1 py-2 font-semibold text-slate-500 hover:text-indigo-600';
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn px-4 py-2 font-medium text-slate-500 hover:text-indigo-600';
      });
      document.getElementById(tabId).classList.remove('hidden');
      event.target.className = 'tab-btn px-4 py-2 font-medium border-b-2 border-indigo-600 text-indigo-600';
    }

    // API Handlers
    async function handleLogin(e) {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.message);
      
      localStorage.setItem('sms_token', data.token);
      localStorage.setItem('sms_user', JSON.stringify(data.user));
      token = data.token;
      currentUser = data.user;
      updateAuthState();
    }

    async function handleRegister(e) {
      e.preventDefault();
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          department: document.getElementById('regDept').value
        })
      });
      const data = await res.json();
      alert(data.message);
      if (res.ok) switchAuthTab('login');
    }

    function handleLogout() {
      localStorage.removeItem('sms_token');
      localStorage.removeItem('sms_user');
      token = null;
      currentUser = null;
      updateAuthState();
    }

    async function loadAdminStats() {
      const res = await fetch('/api/admin/metrics', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      document.getElementById('statStudents').innerText = data.totalStudents || 0;
      document.getElementById('statCourses').innerText = data.totalCourses || 0;
      document.getElementById('statAttendance').innerText = data.totalAttendance || 0;
    }

    async function loadCourses() {
      const res = await fetch('/api/courses');
      const courses = await res.json();
      const tbody = document.getElementById('coursesTableBody');
      const attSelect = document.getElementById('attCourseSelect');
      
      tbody.innerHTML = '';
      attSelect.innerHTML = '<option value="">Select Course</option>';

      courses.forEach(c => {
        tbody.innerHTML += `
          <tr>
            <td class="px-6 py-4 font-bold">${c.course_code}</td>
            <td class="px-6 py-4">${c.course_title}</td>
            <td class="px-6 py-4">${c.credits}</td>
            <td class="px-6 py-4 text-right">
              ${currentUser.role === 'admin' ? `<button onclick="deleteCourse(${c.id})" class="text-red-500 hover:underline">Delete</button>` : '-'}
            </td>
          </tr>
        `;
        attSelect.innerHTML += `<option value="${c.id}">${c.course_code} - ${c.course_title}</option>`;
      });
    }

    async function handleCreateCourse(e) {
      e.preventDefault();
      const res = await fetch('/api/courses', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          course_code: document.getElementById('courseCode').value,
          course_title: document.getElementById('courseTitle').value,
          credits: document.getElementById('courseCredits').value
        })
      });
      if (res.ok) {
        document.getElementById('courseCode').value = '';
        document.getElementById('courseTitle').value = '';
        loadCourses();
        if (currentUser.role === 'admin') loadAdminStats();
      }
    }

    async function deleteCourse(id) {
      if (!confirm('Are you sure you want to delete this course?')) return;
      await fetch(`/api/courses/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      loadCourses();
      loadAdminStats();
    }

    async function loadStudents() {
      const res = await fetch('/api/students', { headers: { 'Authorization': `Bearer ${token}` } });
      const students = await res.json();
      const tbody = document.getElementById('studentsTableBody');
      const attStudentSelect = document.getElementById('attStudentSelect');
      
      tbody.innerHTML = '';
      attStudentSelect.innerHTML = '<option value="">Select Student</option>';

      students.forEach(s => {
        tbody.innerHTML += `
          <tr>
            <td class="px-6 py-4 font-mono font-bold">${s.student_code}</td>
            <td class="px-6 py-4">${s.name}</td>
            <td class="px-6 py-4">${s.email}</td>
            <td class="px-6 py-4">${s.department}</td>
          </tr>
        `;
        attStudentSelect.innerHTML += `<option value="${s.id}">${s.student_code} - ${s.name}</option>`;
      });
    }

    async function handleRecordAttendance(e) {
      e.preventDefault();
      const res = await fetch('/api/attendance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          course_id: document.getElementById('attCourseSelect').value,
          student_id: document.getElementById('attStudentSelect').value,
          attendance_date: document.getElementById('attDate').value,
          status: document.getElementById('attStatus').value
        })
      });
      const data = await res.json();
      alert(data.message);
      if (res.ok) {
        loadAttendance();
        loadAdminStats();
      }
    }

    async function loadAttendance() {
      const res = await fetch('/api/attendance', { headers: { 'Authorization': `Bearer ${token}` } });
      const records = await res.json();
      const tbody = document.getElementById('attendanceTableBody');
      tbody.innerHTML = '';

      records.forEach(r => {
        const badgeColor = r.status === 'Present' ? 'bg-emerald-100 text-emerald-800' :
                           r.status === 'Absent' ? 'bg-rose-100 text-rose-800' : 'bg-amber-100 text-amber-800';
        tbody.innerHTML += `
          <tr>
            <td class="px-6 py-4">${new Date(r.attendance_date).toLocaleDateString()}</td>
            <td class="px-6 py-4 font-medium">${r.student_name} (${r.student_code})</td>
            <td class="px-6 py-4">${r.course_code} - ${r.course_title}</td>
            <td class="px-6 py-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${r.status}</span>
            </td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
